[project]
name = "ai-interview-backend"
version = "0.1.0"
description = "AI interview backend service"
requires-python = ">=3.11,<3.13"
dependencies = [
    "asyncpg>=0.29.0",
    "cryptography>=42.0.0",
    "dramatiq[redis]>=2.2.0",
    "fastapi>=0.104.0",
    "httpx>=0.25.0",
    "langchain>=1.3.0,<2.0.0",
    "langchain-core>=1.4.0,<2.0.0",
    "langchain-openai>=1.2.0,<2.0.0",
    "langfuse>=4.0.0",
    "langgraph>=1.2.0,<2.0.0",
    "langgraph-checkpoint-postgres>=3.1.0,<4.0.0",
    "mem0ai>=0.1.0",
    "openai>=1.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic-settings>=2.1.0",
    "pydantic>=2.5.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.24.0",
    "pgvector>=0.4.2",
    "greenlet>=3.5.1",
    "alembic>=1.18.4",
    "guardrails-ai>=0.10.2",
    "langchain-deepseek>=1.0.0,<2.0.0",
    "langchain-qwq>=0.1.0,<1.0.0",
]

[project.optional-dependencies]
eval = [
    "deepeval>=2.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
extend-exclude = [
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".uv-cache",
    ".venv",
    "data",
    "htmlcov",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
follow_imports = "silent"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
exclude = "(^|/)(data|\\.venv|\\.uv-cache|\\.mypy_cache|\\.ruff_cache|__pycache__)(/|$)"
